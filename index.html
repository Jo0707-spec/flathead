<!doctype html>
<html lang="de">
 
<head>
  <meta charset="utf-8" />
  <title>Flathead Control Center</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Flathead Control Center</h1>
  </header>

  <main class="layout">
    <nav class="menu">
      <button class="menu-btn active" data-target="dashboard">1) Sensor-Daten Dashboard</button>
      <button class="menu-btn" data-target="location">2) Aufenthaltsort des Raspberrys</button>
      <button class="menu-btn" data-target="camera">3) Live Kamera Feed</button>
    </nav>

    <section id="dashboard" class="panel active">
      <div class="panel-header">
        <h2>Sensor-Daten Dashboard</h2>
      </div>

      <div class="grid-cards">
        <article class="card">
          <h3>Temperatur</h3>
          <p><strong id="temperature">--</strong> °C</p>
        </article>

        <article class="card">
          <h3>Himmelsrichtung</h3>
          <p>Richtung: <strong id="heading">--</strong></p>
        </article>

        <article class="card">
          <h3>Luftfeuchtigkeit</h3>
          <p><strong id="humidity">--</strong> %</p>
        </article>

        <article class="card">
          <h3>Distanz</h3>
          <p><strong id="distance">--</strong> cm</p>
        </article>
      </div>

      <div class="status-row">
        <span id="sensor-status">Warte auf Sensordaten …</span>
        <span id="last-updated">--</span>
      </div>
    </section>

    <section id="location" class="panel">
      <div class="panel-header">
        <h2>Aufenthaltsort des Raspberrys</h2>
      </div>

      <div class="grid-cards">
        <article class="card">
          <h3>GPS-Daten</h3>
          <p>Lat: <strong id="lat">--</strong></p>
          <p>Lng: <strong id="lng">--</strong></p>
        </article>

        <article class="card">
          <h3>Manuelle X/Z Steuerung</h3>
          <form id="manual-coord-form" class="coord-form">
            <label>
              X
              <input id="manual-x" type="number" step="0.1" required />
            </label>
            <label>
              Z
              <input id="manual-z" type="number" step="0.1" required />
            </label>
            <button type="submit">An ESP32 senden</button>
          </form>
          <p id="manual-send-status" class="hint">Bereit.</p>
        </article>
      </div>
    </section>

    <section id="camera" class="panel">
      <div class="panel-header">
        <h2>Kamera</h2>
      </div>

      <article class="card video-shell">
        <img id="camera-feed" src="" alt="Live Kamera Feed" />
        <div id="camera-placeholder">Kein Stream</div>
      </article>
    </section>
  </main>
 <script type="module">
  import "./app.js";
</script>
</body>
</html>
